<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Angolgyakorló</title>
<style>
body{font:16px system-ui;background:#f3f5fa;color:#202536;margin:0;padding:16px}.wrap{max-width:650px;margin:auto}.card{background:white;border:1px solid #dce2ed;border-radius:15px;padding:16px;margin:0 0 14px}h1{font-size:23px;margin:0 0 5px}.muted{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{padding:12px;border:1px solid #ccd4e2;border-radius:10px;background:white;font-size:15px}button.active,.primary{background:#315bd6;color:white;border-color:#315bd6}.primary{width:100%;font-weight:bold}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccd4e2;border-radius:10px;font-size:17px;margin:10px 0}#q{font-size:22px;font-weight:bold;margin:16px 0}.bar{height:7px;background:#e9edf5;border-radius:8px}.fill{height:7px;background:#315bd6;border-radius:8px;width:0}.hide{display:none}.good{color:green}.bad{color:#ad5a00}.row{display:flex;justify-content:space-between;margin:7px 0}
</style><body><main class="wrap"><section class="card"><div class="muted">A füzeted alapján</div><h1>📚 Az én angolgyakorlóm</h1><div class="muted">Válassz témát, fordítsd le a mondatot, majd ellenőrizd!</div></section>
<section class="card"><b>Válassz témakört</b><div class="grid" id="topics" style="margin-top:10px"></div></section>
<section class="card"><div class="row"><b id="topic">Vegyes gyakorlás</b><span class="muted" id="count"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="muted" style="margin-top:14px">Fordítsd le angolra:</div><div id="q">Válassz témát!</div><input id="a" placeholder="Írd ide az angol választ…"><button class="primary" id="check">Ellenőrzés</button><div id="feedback" style="min-height:48px;margin:12px 0"></div><button class="primary hide" id="next">Következő →</button></section>
<section class="card"><b>Eredményed</b><div class="row"><span>Helyes válaszok</span><b id="good">0</b></div><div class="row"><span>Hibás válaszok</span><b id="bad">0</b></div><button id="restart" style="width:100%">Újrakezdés</button></section></main>
<script>
const D=[
['be','Én fiú vagyok.','I am a boy.'],['be','Mi fiúk vagyunk.','We are boys.'],['be','Én nem vagyok fiú.','I am not a boy.'],['be','Mi nem vagyunk fiúk.','We aren’t boys.'],['be','Hol vagytok?','Where are you?'],['be','Péter beteg?','Is Peter sick?'],['be','Miért nem voltál otthon?','Why weren’t you at home?'],['be','Miért nem vagy te otthon?','Why aren’t you at home?'],['be','Hol voltatok?','Where were you?'],['be','Hol vannak ők?','Where are they?'],['be','Boldog vagy?','Are you happy?'],['be','Fáradtak vagytok?','Are you tired?'],['be','Miért vagytok szegények?','Why are you poor?'],['be','Miért nem vagytok gazdagok?','Why aren’t you rich?'],
['present','Hol laknak ők?','Where do they live?'],['present','Miért nem tanultok?','Why don’t you learn?'],['present','Miért tanultok angolul?','Why do you learn English?'],['present','Mit csináltok?','What do you do?'],['present','Szereted a sört?','Do you like beer?'],['present','Van pénzed?','Do you have money?'],['present','Miért nem szereted a macskámat?','Why don’t you like my cat?'],['present','A fiam nem szereti a lányodat.','My son doesn’t like your daughter.'],['present','Péter nem dolgozik, mert tanul.','Peter doesn’t work, because he learns.'],['present','Mit dolgozik a fiad?','What does your son do?'],['present','Hol laktok?','Where do you live?'],
['past','Én dolgoztam.','I worked.'],['past','Én nem dolgoztam.','I didn’t work.'],['past','Te dolgoztál?','Did you work?'],['past','Én mentem.','I went.'],['past','Én nem mentem.','I didn’t go.'],['past','Mit csináltatok tegnap?','What did you do yesterday?'],['past','Mit csináltál tegnap?','What did you do yesterday?'],['past','Hol voltál?','Where were you?'],['past','Miért nem voltál otthon?','Why weren’t you at home?'],
['future','Az asztal alatt lesznek a tollaim?','Will my pens be under the table?'],['future','Miért nem leszel otthon?','Why won’t you be at home?'],['future','Mit fogtok csinálni?','What will you do tomorrow?'],['future','Mit fogsz holnap csinálni?','What will you do tomorrow?'],['future','Hol leszel?','Where will you be?'],['future','Hol leszel holnap?','Where will you be tomorrow?'],['future','Szeretni fogsz engem?','Will you love me?'],['future','Mi lesz az asztalodon?','What will be on your table?'],['future','Mi lesz a dobozban?','What will be in the box?'],['future','Mikor lesz tiszta a szobád?','When will your room be clean?'],['future','Tomnak nem lesz kutyája, mert nem szereti azokat.','Tom won’t have a dog, because he doesn’t like them.'],['future','Hogy fogják hívni?','What will be his name?'],['future','Hány évesek ők?','How old are they?'],['future','Nem leszek gazdag, nem lesz pénzem, mert nem dolgozom.','I won’t be rich, I won’t have money, because I don’t work.'],['future','Mi lesz az asztal alatt?','What will be under the table?'],['future','Holnap nem dolgozom, mert beteg vagyok.','I won’t work tomorrow, because I am sick.'],['future','Mikor lesz olcsó a sör?','When will beer be cheap?'],['future','Hány éves lesz a fiad holnap?','How old will your son be tomorrow?'],['future','Mikor lesz pénzed?','When will you have money?'],['future','Mikor leszel gazdag?','When will you be rich?'],['future','Miért nem lesz nekik kutyájuk?','Why won’t they have a dog?'],
['questions','Ki szereti Tomot?','Who likes Tom?'],['questions','Ki nem szereti Tomot?','Who doesn’t like Tom?'],['questions','Kit szeret Tom?','Who does Tom like?'],['questions','Kit nem szeret Tom?','Who doesn’t Tom like?'],['questions','Ki szeret engem?','Who likes me?'],['questions','Hány éves vagy?','How old are you?'],['questions','Mennyi vizet?','How much water?'],['questions','Hány könyvet?','How many books?'],['questions','Miért nem szeretsz?','Why don’t you like me?'],['questions','Mi van az asztalodon?','What is on your table?'],['questions','Mit csinálsz?','What do you do?'],['questions','Hol laktok?','Where do you live?'],
['pronouns','Nem szeretem őt, ő nem szeret engem.','I don’t like him, he doesn’t like me.'],['pronouns','Én nem szeretem őket, ők nem szeretnek engem.','I don’t like them, they don’t like me.'],['pronouns','Szeretem őket.','I like them.'],['pronouns','Az én autóm.','My car.'],['pronouns','A te tollad.','Your pen.'],['pronouns','Az ő kutyája (fiú).','His dog.'],['pronouns','Az ő macskája (lány).','Her cat.'],['pronouns','A mi házunk.','Our house.'],['pronouns','Az ő asztaluk.','Their table.'],
['prepositions','Az asztal alatt.','Under the table.'],['prepositions','Valami előtt.','In front of something.'],['prepositions','Az iskola mögött.','Behind the school.'],['prepositions','A ház mellett.','Beside the house.'],['prepositions','Az autó közelében.','Near the car.'],['prepositions','Messze a háztól.','Far from the house.'],['prepositions','A fiúk nélkül.','Without the boys.'],['prepositions','A lányok nélkül.','Without the girls.'],['prepositions','Reggeli előtt.','Before breakfast.'],['prepositions','Reggeli után.','After breakfast.']
];
const labels={all:'Vegyes gyakorlás',be:'Am / is / are',present:'Do / does',past:'Múlt idő',future:'Will / won’t',questions:'Kérdőszavak',pronouns:'Névmások',prepositions:'Elöljárószavak'};
let topic='all',set=[],i=0,good=0,bad=0,done=false;const $=x=>document.getElementById(x);
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.,?!]/g,'').replace(/\s+/g,' ').trim();
function start(t){topic=t;set=D.filter(x=>t==='all'||x[0]===t).sort(()=>Math.random()-.5);i=good=bad=0;$('topic').textContent=labels[t];$('good').textContent=0;$('bad').textContent=0;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===t));show()}
function show(){done=false;$('count').textContent=(i+1)+' / '+set.length;$('fill').style.width=(i/set.length*100)+'%';$('q').textContent=set[i][1];$('a').value='';$('a').disabled=false;$('feedback').textContent='';$('check').disabled=false;$('check').classList.remove('hide');$('next').classList.add('hide')}
function check(){if(done)return;if(!$('a').value.trim()){$('feedback').textContent='Írd be a válaszodat!';return}done=true;$('a').disabled=true;$('check').disabled=true;if(norm($('a').value)===norm(set[i][2])){good++;$('feedback').innerHTML='<b class="good">✓ Helyes! Nagyon ügyes vagy!</b>'}else{bad++;$('feedback').innerHTML='<b class="bad">Most nem sikerült. Semmi baj!</b><br>Helyes válasz: <b>'+set[i][2]+'</b>'}$('good').textContent=good;$('bad').textContent=bad;$('next').classList.remove('hide');$('next').textContent=i===set.length-1?'Eredmény':'Következő kérdés →'}
function next(){if(i<set.length-1){i++;show()}else{$('q').textContent=good>=set.length*.85?'Szuper munka! 🏆':good>=set.length*.65?'Nagyon szép eredmény! 🌟':'Gyakorlással menni fog! ❤️';$('count').textContent=set.length+' / '+set.length;$('fill').style.width='100%';$('a').classList.add('hide');$('check').classList.add('hide');$('next').classList.add('hide');$('feedback').innerHTML='Eredmény: <b>'+good+' / '+set.length+'</b><br>Hibás válasz: '+bad}}
[['all','🎯 Összes kérdés'],['be','Am / is / are'],['present','Do / does'],['past','Múlt idő'],['future','Will / won’t'],['questions','Kérdőszavak'],['pronouns','Névmások'],['prepositions','Elöljárószavak']].forEach(([t,l])=>{let b=document.createElement('button');b.textContent=l;b.dataset.t=t;b.onclick=()=>{$('a').classList.remove('hide');start(t)};$('topics').appendChild(b)});
$('check').onclick=check;$('next').onclick=next;$('a').onkeydown=e=>{if(e.key==='Enter'){done?next():check()}};$('restart').onclick=()=>{$('a').classList.remove('hide');start(topic)};start('all');
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(() => {}));
}
</script>
</body></html>
